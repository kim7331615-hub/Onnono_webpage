<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="자연을 닮은 소재와 부드러운 곡선으로 완성한 Onnono의 신상품 컬렉션.">
  <title>NEW COLLECTION — ONNONO</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="shop">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header id="site-header"></header>
  <main id="main">
    <a href="#collection" class="shop-hero" aria-label="신상품 컬렉션 보기"><picture><source media="(max-width: 600px)" srcset="assets/new-collection-mobile.png"><source media="(max-width: 1100px)" srcset="assets/new-collection-tablet.png"><img src="assets/new-collection.png" alt="새로운 계절, 공간에 자연스럽게 스며들다. NEW COLLECTION 2026" width="1942" height="809" fetchpriority="high"></picture></a>
    <section class="section collection-section" id="collection" aria-labelledby="collection-title">
      <div class="section-heading"><h1 id="collection-title">NEW COLLECTION</h1><span class="heading-line"></span><p>자연을 닮은 소재와 부드러운 곡선으로 완성한<br>Onnono의 신상품 컬렉션입니다.</p></div>
      <div class="catalog-tools page-width">
        <div class="filter-list" aria-label="상품 카테고리">
          <button type="button" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" data-filter="sofa" aria-pressed="false">소파</button>
          <button type="button" data-filter="chair" aria-pressed="false">체어</button>
          <button type="button" data-filter="table" aria-pressed="false">테이블</button>
          <button type="button" data-filter="storage" aria-pressed="false">수납</button>
          <button type="button" data-filter="bed" aria-pressed="false">침대</button>
          <button type="button" data-filter="lighting" aria-pressed="false">조명</button>
          <button type="button" data-filter="decor" aria-pressed="false">리빙</button>
        </div>
        <div class="catalog-meta"><p id="result-count" aria-live="polite"></p><label class="sr-only" for="sort-order">상품 정렬</label><select id="sort-order"><option value="default">추천순</option><option value="low">낮은 가격순</option><option value="high">높은 가격순</option><option value="name">상품명순</option></select></div>
      </div>
      <p class="search-summary page-width" id="search-summary" hidden></p>
      <div class="product-grid page-width" id="catalog-grid"></div>
      <div id="catalog-empty" class="empty-state" hidden><h2>아직 준비 중인 컬렉션이에요.</h2><p>다른 공간의 상품도 함께 둘러보세요.</p><button type="button" class="primary-button" data-reset-filter>전체 상품 보기</button></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <div id="overlays"></div>
</body>
</html>
